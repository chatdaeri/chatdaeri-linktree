<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오픈 알림 신청 취소 | 챗대리</title>
<style>
  @font-face { font-family: Pretendard; src: url(../assets/fonts/PretendardVariable.woff2) format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: Pretendard, system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  main { max-width: 480px; margin: 18vh auto 0; padding: 0 24px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.6; color: #444; margin: 0 0 24px; }
  button { height: 50px; padding: 0 28px; font: 600 16px Pretendard, sans-serif; color: #fff; background: #FF7E5F; border: 0; border-radius: 99px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 20px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>오픈 알림 신청 취소</h1>
  <p>「클로드 코드로 만드는 AI 에이전트 시스템」 오픈 알림 신청을 취소하고 신청 정보를 삭제합니다.</p>
  <button type="button">신청 취소하기</button>
  <p class="msg" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search), u = q.get('u'), t = q.get('t');
  const btn = document.querySelector('button'), msg = document.querySelector('.msg');
  if (!u || !t) { btn.disabled = true; msg.textContent = '링크가 올바르지 않습니다. 접수 메일의 링크를 다시 눌러 주세요.'; return; }
  btn.addEventListener('click', async () => {
    btn.disabled = true; msg.textContent = '처리 중입니다…';
    try {
      const r = await fetch('https://tkudxecgofobkhlsddfx.supabase.co/functions/v1/prelaunch-signup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'cancel', u, t })
      });
      if (r.ok) { msg.textContent = '신청이 취소되었습니다. 신청 정보를 삭제했습니다.'; return; }
      msg.textContent = '링크가 올바르지 않습니다. jinju@chatdaeri.com으로 알려 주시면 처리해 드립니다.';
    } catch (_) { msg.textContent = '네트워크 오류입니다. 잠시 후 다시 시도해 주세요.'; }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
